  abstract: Brillouin light scattering spectroscopy was used along with detailed composition
    information obtained from electron probe microanalysis to study the influence
    of octahedral site chemistry on the elastic properties of natural biotite crystals.
    Elastic wave velocities for a range of directions in the ac and bc crystallographic
    planes were obtained for each crystal by application of the well-known Brillouin
    equation with refractive indices and phonon frequencies obtained from the Becke
