    of 1D functions'
  authors: Andrew Yang and Christopher L Farrow and Pavol JuhÃĄs and Luis Kitsu Iglesias
    and Chia-Hao Liu and Samuel D Marks and Vivian RK Wall and Joshua Safin and Sean
    M Drewry and Caden Myers and Dillon F Hanlon and Nicholas Leonard and Cedomir
