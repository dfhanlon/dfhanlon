  abstract: In this study, we explore how proteins and water molecules interact which
    could be of importance in fully understanding biological processes. By using Brillouin
    light scattering and molecular dynamics together, we aim to learn more about these
    interactions. Specifically, Brillouin spectroscopy was employed to investigate
    the temperature dependence of the viscoelastic properties of gastropod mucus,
    in both its natural and hydrated and dehydrated states, and in a bacterial cell
    lysate solution. Additionally, time-dependent Brillouin scattering studies were
    conducted on dehydrated mucus. The concentration of proteins in both the hydrated
