  title: Coupled order parameters and photoinduced domain walls in the charge density
    wave of (TaSe4)2I
  authors: Ryan A Duncan and Gal Orenstein and Soyeun Kim and Yijing Huang and Huaiyu
    Wang and Samuel W Teitelbaum and Jade Stanton and Matthew Hurley and Alexander
    Miller and Nicholas Leonard and Dillon Hanlon and David A Reis and Taito Osaka
    and Yuya Kubota and Tadashi Togashi and Kejian Qu and Daniel P Shoemaker and Takahiro
    Sato and Mariano Trigo
  year: 2025
  journal: npj Quantum Materials
  citation: npj Quantum Materials 10 (1), 45, 2025
  abstract: The charge density wave in (TaSe4)2I has drawn much attention recently
    as a controversial candidate for an axion insulator where the CDW breaks the chiral
    symmetry of the Weyl semimetal. Here we use ultrafast x-ray scattering to study
    the collective modes of this CDW. By measuring several diffraction peaks we find
    that the order parameter involves coupled optical and acoustic modes. For strong
    near-infrared excitation, the dynamics of the x-ray diffraction show evidence
    of photoinduced inversion of both components of the CDW order parameter, and associated
    domain walls. These results demonstrate the potential of ultrafast methods to
    induce topological defects through highly nonequilibrium dynamics. In (TaSe4)2I
    these defects should lead to exotic electronic states due to the nontrivial topology
    of the band structure.
