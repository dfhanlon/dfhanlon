- id: 4
  title: Influence of hydration and dehydration on the viscoelastic properties of
    snail mucus by brillouin spectroscopy
  authors: Dillon F Hanlon and Maynard J Clouter and G Todd Andrews
  year: 2023
  journal: arXiv preprint arXiv:2308.00524
  citation: arXiv preprint arXiv:2308.00524, 2023
  abstract: 'Brillouin spectroscopy was used to probe the viscoelastic properties
    of diluted snail mucus at GHz frequencies over the range -11 C  52 C and of dehydrated
    mucus as a function of time. Two peaks were observed in the spectra for diluted
    mucus: the longitudinal acoustic mode of the liquid mucus peak varies with dilution
    but fluctuates around the typical value of 8.0 GHz. A second peak due to ice remained
    unchanged with varying dilution and was seen at 18.0 GHz and appeared below the
    dilutions "freezing" point depression. Only a single peak was found in all the
    dehydrated mucus spectra and was also attributed to the longitudinal acoustic
    mode of liquid mucus. Anomalous changes in the protein concentration dependence
    of the frequency shift, linewidth, and ``freezing" point depression and consequently,
    hypersound velocity, compressibility, and apparent viscosity suggest that the
    viscoelastic properties of this system is influenced by the presence of water.
    Furthermore, this research uncovered three unique transitions within the molecular
    structure. These transitions included the first stage of glycoprotein cross-linking,
    followed by the steady depletion of free water in the system, and eventually resulted
    in the creation of a gel-like state when all remaining free water was evaporated.'
  url: https://arxiv.org/abs/2308.00524
  num_citations: 2
  type: preprint
- id: 6
  title: Probing the Viscoelastic Properties of Aqueous Protein Solutions using Molecular
    Dynamics Simulations
  authors: Dillon F Hanlon and Ivan Saika-Voivod and M Shajahan G Razul and G Todd
    Andrews
  year: 2023
  journal: arXiv preprint arXiv:2309.09119
  citation: arXiv preprint arXiv:2309.09119, 2023
  abstract: We performed molecular dynamics simulations to investigate the viscoelastic
    properties of aqueous protein solutions containing an antifreeze protein, a toxin
    protein, and bovine serum albumin. These simulations covered a temperature range
    from 280 K to 340 K. Our findings demonstrate that lower temperatures are associated
    with higher viscosity as well as a lower bulk modulus and speed of sound for all
    the systems studied. Furthermore, we observe an increase in the bulk modulus and
    speed of sound as the temperature increases up to a weak maximum while the viscosity
    decreases. Moreover, we analyzed the influence of protein concentration on the
    viscoelastic properties of the antifreeze protein solution. We observed a consistent
    increase in the bulk modulus, speed of sound, and viscosity as the protein concentration
    increased. Remarkably, our molecular dynamics simulations results closely resemble
    the trends observed in Brillouin scattering experiments on aqueous protein solutions.
    The similarity thus validates the use of simulations in studying the viscoelastic
    properties of protein water solutions. Ultimately, this work provides motivation
    for the integration of computer simulations with experimental data and holds potential
    for advancing our understanding of both simple and complex systems.
  url: https://arxiv.org/abs/2309.09119
  num_citations: 1
  type: preprint
- id: 10
  title: 'Brillouin light scattering studies of aqueous E. coli cell lysate: Viscoelastic
    properties of a multimacromolecular solution'
  authors: DF Hanlon and S Heravi and V Booth and GT Andrews
  year: 2023
  journal: arXiv preprint arXiv:2311.05761
  citation: arXiv preprint arXiv:2311.05761, 2023
  abstract: Brillouin spectroscopy was used to probe the viscoelastic properties of
    E. coli bacterial cell lysate in aqueous solution at GHz-frequencies over the
    range -5.0 C  50.0 C. This work offers a first temperature dependent study on
    cell lysate by Brillouin light scattering. A single peak was observed in the spectra
    and attributed to a longitudinal acoustic mode of the solution. The speed of sound,
    bulk modulus, apparent viscosity and hypersound attenuation were extracted from
    the frequency shift and FWHM of the spectral peak. This study demonstrate that
    the behavior of complex multimacromolecular solutions, as shown by \textit{E.
    coli} lysate, can exhibit viscoelastic properties closely akin to those observed
    in simple binary aqueous protein solutions. Furthermore, our findings show that
    by analyzing the raw spectral signature of the Brillouin spectra, it may be possible
    to identify protein denaturation.
  url: https://arxiv.org/abs/2311.05761
  num_citations: 0
  type: preprint
