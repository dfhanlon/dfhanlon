    and Michael F Toney and Katharine Page and Naomi S Ginsberg and Simon JL Billinge
  year: 2026
  journal: arXiv preprint arXiv:2602.06987
  citation: arXiv preprint arXiv:2602.06987, 2026
  abstract: diffpymorph addresses a need to gain scientific insights from 1D scientific
    spectra in model independent ways. A powerful approach for this is to take differences
    between pairs of spectra and look for meaningful changes that might indicate underlying
    chemical, structural, or other modifications. The challenge is that the difference
    curve may contain uninteresting differences such as experimental inconsistencies
    and benign physical changes such as the effects of thermal expansion. diffpymorph
    allows researchers to apply simple transformations, or "morphs", to one of the
    datasets to remove the unwanted differences revealing, when they are present,
    non-trivial differences. diffpymorph is an open-source Python package available
    on the Python Package Index and conda-forge. Here, we describe its functionality
    and apply it to solve a range of experimental challenges on diffraction and PDF
    data from x-rays and neutrons, though we note that it may be applied to any 1D
    function in principle.
  url: https://arxiv.org/abs/2602.06987
