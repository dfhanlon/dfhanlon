  abstract: In this Letter, we present the experimental observation of squeezed phonon
    generation in semiconductor germanium (Ge) induced by x-ray excitation. Prior
    x-ray pump, x-ray probe studies reported coherent longitudinal acoustic phonon
    generation in insulating oxides like strontium titanate and potassium tantalate.
    In contrast, such signals were not observed in semiconductors likely due to limited
    signal-to-noise ratio. Now, with an improved experimental setup, we observe a
    phonon response in single-crystal germanium. Utilizing x-ray split-delay optics
    with enhanced stability, we extract the phonon dispersion relation, which shows
    strong agreement with the calculated transverse acoustic phonon mode. Our results
    reveal that responses to x-ray excitations in semiconductors are of a similar
